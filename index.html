<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Глеб — резюме веб-разработчика</title>
    <meta name="description" content="Резюме: Разработчик Web и мультимедийных приложений" />
    <script>
      // Тема применяется до загрузки React, чтобы не было мигания
      try {
        const theme = localStorage.getItem('theme')
        if (theme) document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
